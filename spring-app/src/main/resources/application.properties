# Default DataSource config — overridden at runtime via environment variables.
# Required at AOT processing time so the application context can be resolved.
spring.datasource.url=jdbc:postgresql://localhost:5432/streamrune_ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.mode=never
