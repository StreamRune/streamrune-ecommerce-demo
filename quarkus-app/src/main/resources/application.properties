quarkus.application.name=quarkus-ecommerce
quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/streamrune_ecommerce
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Demo schema is owned by scripts/init-db.sql (shared by spring-app, quarkus-app, micronaut-app).
# Disable Flyway auto-init so the library factory does not try to re-run its own migration series
# (classpath:db/streamrune-migration, on its own flyway_schema_history_streamrune history table) against
# the pre-created schema — baselineOnMigrate/baselineVersion=0 only tolerates a non-empty schema
# holding the APPLICATION's own unrelated tables, not a hand-pre-created copy of the framework's own
# tables, so V001's plain CREATE TABLE would abort on boot ("relation already exists").
streamrune.event-store.schema.auto-initialize=false

# Request identity, decided for this app: TRUSTED-GATEWAY MODE, not an authenticated resolver.
# The demo has no login and no quarkus-security module, so it stands in for a gateway that would
# authenticate every caller, overwrite X-User-Id with the authenticated id and strip any X-User-Id
# or X-User-Role a client sent. Nothing does that here: the frontend, the tutorial's curl examples
# and the integration tests send X-User-Id themselves, which is acceptable only for a local
# showcase. Never enable the flag in production unless such a gateway is in front. The framework
# never takes the identity from X-User-Id without it: every request would be anonymous, and the app
# would refuse to start because annotation authorization is configured. The flag covers
# X-User-Role too: the framework reads it into baggage `role` only in this mode, and
# HeaderUserRoleResolver authorizes on it, a demo shortcut a real deployment must not copy. The
# same decision holds for the other two apps. The startup log names the mode
# ("Request identity: TRUSTED_GATEWAY ...").
streamrune.security.trust-user-id-header=true

# The framework's auto-registered GET /api/sse/{aggregateType}/{aggregateId} SSE endpoint is now
# default-off and requires an SseAuthorizer bean (see StreamRuneProducer#sseAuthorizer). Enabled
# here for parity with the Spring app's SseController + SseLiveE2EIT showcase feature.
streamrune.sse.enabled=true

# Native image: Flyway's InsertRowLock holds a static java.util.Random field that GraalVM forbids
# in the image heap (Random instances have cached seed state that must not be baked in at build
# time). Defer InsertRowLock's class initializer to runtime so the Random is created fresh on
# each startup rather than captured during the native build.
quarkus.native.additional-build-args=--initialize-at-run-time=org.flywaydb.core.internal.database.InsertRowLock

# Transactional outbox → RabbitMQ
streamrune.outbox.enabled=true
streamrune.outbox.flush-interval-ms=1000

# RabbitMQ connection (override per environment or via env var e.g. RABBITMQ_HOST)
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USER:guest}
rabbitmq.password=${RABBITMQ_PASS:guest}

# Test profile: disable the outbox by default so tests without a RabbitMQ container do not try
# to open an AMQP connection. IntegrationOutboxE2EIT opts back in via RabbitMqTestResource which
# overrides streamrune.outbox.enabled=true and supplies the broker coordinates.
%test.streamrune.outbox.enabled=false

# CORS — allow the Next.js frontend on localhost:3000 to call the API.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*

# Seed data: disabled in tests so E2E ITs can manage their own fixture state without
# racing the seed commands. Set to false in the test profile; true everywhere else.
app.seed.enabled=true
%test.app.seed.enabled=false

# Test profile: speed up projection polling so E2E ITs don't time out waiting for
# read-model catch-up. 500 ms matches the saga subscription cadence (EcommerceSubscriptionLifecycle).
%test.streamrune.polling-interval-ms=500
%test.streamrune.polling-jitter-ms=100

# Test profile: the compensation retry sweeper (started by the framework for the order-fulfillment
# SagaRunner bean) re-drives a stuck COMPENSATING saga every second instead of every minute, so
# SagaRecoveryAdminIT can watch it finish one.
%test.streamrune.saga.compensation-retry-interval=1s
