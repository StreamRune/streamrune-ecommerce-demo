# Disable seed data runner in integration tests so E2E ITs can manage their own
# fixture state without racing the seed commands.
app:
  seed:
    enabled: false

# Bind each test-context Micronaut server to a random port so test classes that
# create separate application contexts (e.g. IntegrationOutboxE2EIT with its own
# Postgres + RabbitMQ containers) don't collide with the shared-context server
# that the AbstractIntegrationTest group holds open on the same port.
# Micronaut Test wires @Client("/") to the actual running port automatically.
micronaut:
  server:
    port: -1

# The read models follow the event store every 500 ms (plus up to 100 ms of jitter) instead of the
# default 5 s (plus up to 1 s), as in the Quarkus and Spring test configurations: a test that
# awaits a row waits for one short poll, far below its limit, and a saga-driven status that needs
# two polls is there in about a second.
streamrune:
  polling-interval-ms: 500
  polling-jitter-ms: 100
