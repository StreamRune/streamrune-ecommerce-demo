micronaut:
  application:
    name: micronaut-ecommerce
  server:
    port: 8081
    netty:
      # The StreamRune filter binds the request context (user id, role) on the thread it runs the
      # route on. With the default STREAMED server type a request body that arrives after the
      # headers resumes the route on the Netty event loop instead, outside that binding, and the
      # controller sees no identity and no role. FULL_CONTENT reads the whole request before
      # routing, so every route runs inside the binding.
      server-type: full_content
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3000
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - "*"
  endpoints:
    health:
      enabled: true
      sensitive: false

app:
  seed:
    enabled: true

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/streamrune_ecommerce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

streamrune:
  event-store:
    type: postgres
    # The framework creates its own schema at startup (this is also the default): the event
    # store's Flyway series and, because a PostgreSQL-backed CryptoEngine bean is present, the
    # crypto series, each on its own history table. The demo ships no DDL of its own; an empty
    # database is all the app needs (the same in spring-app and quarkus-app).
    schema:
      auto-initialize: true
  outbox:
    enabled: true
  security:
    # Request identity, decided for this app: TRUSTED-GATEWAY MODE, not an authenticated resolver.
    # The demo has no login and no micronaut-security module, so it stands in for a gateway that
    # would authenticate every caller, overwrite X-User-Id with the authenticated id and strip any
    # X-User-Id or X-User-Role a client sent. Nothing does that here: the frontend, the tutorial's
    # curl examples and the integration tests send X-User-Id themselves, which is acceptable only
    # for a local showcase. Never enable the flag in production unless such a gateway is in front.
    # The framework never takes the identity from X-User-Id without it: every request would be
    # anonymous, and the app would refuse to start because annotation authorization is configured.
    # The flag covers X-User-Role too: the framework reads it into baggage `role` only in this mode,
    # and HeaderUserRoleResolver authorizes on it, a demo shortcut a real deployment must not copy.
    # The same decision holds for the other two apps. The startup log names the mode
    # ("Request identity: TRUSTED_GATEWAY ...").
    trust-user-id-header: true
  sse:
    # GET /api/sse/{aggregateType}/{aggregateId} is off by default and requires an SseAuthorizer
    # bean: StreamRuneFactory#sseAuthorizer lets in an authenticated ADMIN or the customer the
    # stream belongs to, and refuses everyone else with 403. Once enabled, the framework feeds the
    # endpoint itself: one SseEventFeed per application instance reads the global stream from its
    # head, every streamrune.sse.polling-interval (1s by default), and publishes each new event to
    # the clients of that event's stream. SseLiveE2EIT and SseStreamAccessIT exercise it.
    enabled: true

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: 5672
  username: ${RABBITMQ_USERNAME:guest}
  password: ${RABBITMQ_PASSWORD:guest}
