[versions]
# Unreleased preview, published to https://central.sonatype.com/repository/maven-snapshots/
# (declared in the root build.gradle.kts). A ../streamrune checkout replaces it via the composite
# build in settings.gradle.kts.
streamrune = "1.0.0-alpha-SNAPSHOT"
# Frameworks
spring-boot = "4.1.1"
spring-dependency-management = "1.1.6"
quarkus = "3.40.1"
micronaut = "5.2.19"
micronaut-serde = "3.2.4"
micronaut-test = "5.2.0"
micronaut-application = "4.2.1"
micronaut-sql = "7.2.0"
# The Micronaut Micrometer module for core 5.2 (the version the micronaut-platform 5.2 BOM pairs with
# the serde, sql and test versions above).
micronaut-micrometer = "6.1.0"

# Core
# spring-app runs the Jackson that Spring Boot manages (2.21.5); this version reaches the shared
# modules, quarkus-app and micronaut-app.
jackson = "2.22.4"
postgresql = "42.7.14"
# Kept in step with the StreamRune framework build, whose PgAdvisoryLocker runs on it: quarkus-app builds the
# aggregate lock's pool with it (AdvisoryLockPool), and the Quarkus BOM manages no version of it.
hikaricp = "6.2.1"
# Kept in step with the StreamRune framework build (Flyway 13 accepts PostgreSQL 18 without the "Flyway upgrade
# recommended" WARN that 10.22.0 logged). The framework's event store applies its schema at startup, so no demo
# module declares these two aliases; Flyway reaches the apps through streamrune-postgres.
flyway = "13.11.1"
slf4j = "2.0.16"

# Validation
jakarta-validation = "3.0.2"

# Messaging
rabbitmq = "5.25.0"

# Observability
opentelemetry = "1.47.0"

# Jakarta
jakarta-annotation = "3.0.0"

# Other
snakeyaml = "2.2"
# Kept in step with the StreamRune framework build: streamrune-micronaut compiles against it, and
# the Quarkus BOM manages the same version. micronaut-app's dependency-management plugin applies this
# version to the framework's request for Reactor too.
reactor = "3.8.7"

# Testing
junit = "6.1.3"
testcontainers = "1.21.4"
assertj = "3.27.7"
awaitility = "4.2.2"

# Build plugins
spotless = "7.1.0"
graalvm = "1.1.14"

[libraries]
# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Validation
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }

# Messaging
rabbitmq-client = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }

# Observability
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }

# Spring
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }

# Quarkus
quarkus-bom = { module = "io.quarkus:quarkus-bom", version.ref = "quarkus" }

# Micronaut
micronaut-jdbc-hikari = { module = "io.micronaut.sql:micronaut-jdbc-hikari", version.ref = "micronaut-sql" }
micronaut-inject = { module = "io.micronaut:micronaut-inject", version.ref = "micronaut" }
micronaut-graal = { module = "io.micronaut:micronaut-graal", version.ref = "micronaut" }
micronaut-inject-java = { module = "io.micronaut:micronaut-inject-java", version.ref = "micronaut" }
micronaut-http-server-netty = { module = "io.micronaut:micronaut-http-server-netty", version.ref = "micronaut" }
micronaut-management = { module = "io.micronaut:micronaut-management", version.ref = "micronaut" }
micronaut-micrometer-core = { module = "io.micronaut.micrometer:micronaut-micrometer-core", version.ref = "micronaut-micrometer" }
micronaut-micrometer-annotation = { module = "io.micronaut.micrometer:micronaut-micrometer-annotation", version.ref = "micronaut-micrometer" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson", version.ref = "micronaut-serde" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor", version.ref = "micronaut-serde" }
micronaut-test-junit5 = { module = "io.micronaut.test:micronaut-test-junit5", version.ref = "micronaut-test" }

# Jakarta
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }

# Other
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq", version.ref = "testcontainers" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
graalvm = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut-application" }
