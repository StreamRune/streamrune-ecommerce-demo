name: Native Image Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'domain/**'
      - 'commands/**'
      - 'queries/**'
      - 'projections/**'
      - 'spring-app/**'
      - 'quarkus-app/**'
      - 'micronaut-app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/native-image-smoke-test.yml'
  pull_request:
    paths:
      - 'domain/**'
      - 'commands/**'
      - 'queries/**'
      - 'projections/**'
      - 'spring-app/**'
      - 'quarkus-app/**'
      - 'micronaut-app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/native-image-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        framework: [spring, quarkus, micronaut]
    runs-on: ubuntu-latest
    name: ${{ matrix.framework }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: streamrune_ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        # The binaries start without a broker (their outbox publishers connect on the first
        # publish); with one, each publisher connects and publishes through the native amqp-client,
        # which the smoke script's output check covers. No health-cmd: a root-run
        # rabbitmq-diagnostics racing the broker's first start can write an Erlang cookie the
        # broker cannot read; the smoke script waits for the broker's own startup log line instead.
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v7
        with:
          path: streamrune-ecommerce-demo

      - uses: actions/checkout@v7
        with:
          repository: StreamRune/streamrune
          path: streamrune

      # GraalVM CE 25.0.1, the GraalVM the README names for native builds, pinned to that release
      # rather than the latest GraalVM 25.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25.0.1'
          distribution: 'graalvm-community'
          check-for-updates: 'false'

      - uses: gradle/actions/setup-gradle@v6

      # native-build-tools (the Spring and Micronaut builds) refuses its default
      # reachability-metadata repository when the GraalVM installation has no
      # lib/svm/schemas/reachability-metadata-schema.json, and GraalVM CE 25.0.1 has none. As the
      # README says ("GraalVM Native Image"), the build is pointed at a copy of that repository
      # without its schema files: version 1.0.20, the default of native-build-tools 1.1.17. The
      # first line stops the job when the plugin's version changes, so that the two move together.
      - name: Reachability-metadata repository without its schema (Spring, Micronaut)
        if: matrix.framework != 'quarkus'
        working-directory: streamrune-ecommerce-demo
        env:
          METADATA_VERSION: '1.0.20'
        run: |
          grep -q '^graalvm = "1.1.17"$' gradle/libs.versions.toml || {
            echo "::error::native-build-tools is not 1.1.17: set METADATA_VERSION to its default reachability-metadata version"
            exit 1
          }
          repo="$RUNNER_TEMP/reachability-metadata"
          curl -fsSL -o "$RUNNER_TEMP/reachability-metadata.zip" \
            "https://github.com/oracle/graalvm-reachability-metadata/releases/download/${METADATA_VERSION}/graalvm-reachability-metadata-${METADATA_VERSION}.zip"
          mkdir -p "$repo"
          unzip -q "$RUNNER_TEMP/reachability-metadata.zip" -d "$repo"
          rm "$repo"/schemas/reachability-metadata-schema-v*.json
          echo "ORG_GRADLE_PROJECT_graalvmMetadataRepository=$repo" >> "$GITHUB_ENV"

      - name: Build native image (Spring)
        if: matrix.framework == 'spring'
        working-directory: streamrune-ecommerce-demo
        run: |
          ./gradlew :spring-app:nativeCompile \
            -x test -x spotlessCheck --no-daemon

      - name: Build native image (Quarkus)
        if: matrix.framework == 'quarkus'
        working-directory: streamrune-ecommerce-demo
        run: |
          ./gradlew :quarkus-app:build \
            -Dquarkus.native.enabled=true \
            -Dquarkus.package.jar.enabled=false \
            -x test -x spotlessCheck --no-daemon

      - name: Build native image (Micronaut)
        if: matrix.framework == 'micronaut'
        working-directory: streamrune-ecommerce-demo
        run: |
          ./gradlew :micronaut-app:nativeCompile \
            -x test -x spotlessCheck --no-daemon

      # The same script developers run locally, against the job's service containers and the
      # binary built above. The database is empty: the binary creates the schema itself at startup
      # from the migration scripts the framework registers as native-image resources, and the
      # script requires the tables to be there. Then health, a command-to-read-model round
      # trip, the replay of a dead-lettered command through its sealed root (DLQ registerCommand
      # of a sealed root needs the root registered for reflection in the image; on Quarkus and
      # Micronaut that is the app's reachability-metadata.json, since @RegisterForReflection and
      # @TypeHint do not list permitted subclasses), a 1.5 MiB read model written and read
      # back, and an order its fulfillment saga takes to COMPLETED (the saga origin in an event's
      # metadata written and read by the binary). It then stops the binary with SIGTERM, waits
      # for it to exit, and fails on any UnsupportedFeatureError in the binary's output, shutdown
      # included (the Micronaut binary's Netty 4.2 needs -H:+SharedArenaSupport for that, see
      # micronaut-app/build.gradle.kts).
      - name: Smoke test (Spring)
        if: matrix.framework == 'spring'
        working-directory: streamrune-ecommerce-demo
        env:
          SMOKE_SKIP_BUILD: '1'
          SMOKE_PG_CONTAINER: ${{ job.services.postgres.id }}
          SMOKE_RABBIT_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: bash scripts/native-image-smoke-test.sh spring

      - name: Smoke test (Quarkus)
        if: matrix.framework == 'quarkus'
        working-directory: streamrune-ecommerce-demo
        env:
          SMOKE_SKIP_BUILD: '1'
          SMOKE_PG_CONTAINER: ${{ job.services.postgres.id }}
          SMOKE_RABBIT_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: bash scripts/native-image-smoke-test.sh quarkus

      - name: Smoke test (Micronaut)
        if: matrix.framework == 'micronaut'
        working-directory: streamrune-ecommerce-demo
        env:
          SMOKE_SKIP_BUILD: '1'
          SMOKE_PG_CONTAINER: ${{ job.services.postgres.id }}
          SMOKE_RABBIT_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: bash scripts/native-image-smoke-test.sh micronaut
