name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-integration:
    name: Spring backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          path: streamrune-ecommerce-demo

      - uses: actions/checkout@v7
        with:
          repository: StreamRune/streamrune
          path: streamrune

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v6

      # The integration tests use Testcontainers, which expects a Docker
      # daemon. ubuntu-latest runners ship Docker out of the box; expose it
      # via the default socket.
      - name: Verify Docker available
        run: docker info

      - name: Run :spring-app:test
        working-directory: streamrune-ecommerce-demo
        run: ./gradlew :spring-app:test --console=plain --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spring-app-test-reports
          path: |
            streamrune-ecommerce-demo/spring-app/build/reports/tests/
            streamrune-ecommerce-demo/spring-app/build/test-results/

  # The tests of every other module gate a pull request too: the access rule and the deciders are
  # unit-tested in the shared modules, and each of the three apps has its own integration suite
  # over the same REST API. One job per suite, so a failure names the app it belongs to.
  backend-modules:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Quarkus backend integration tests
            id: quarkus-app
            tasks: ':quarkus-app:test'
          - name: Micronaut backend integration tests
            id: micronaut-app
            tasks: ':micronaut-app:test'
          # Every module that is not one of the three apps: domain, commands, queries,
          # projections, notifications-service, and any module added later.
          - name: Shared module tests
            id: shared-modules
            tasks: 'test -x :spring-app:test -x :quarkus-app:test -x :micronaut-app:test'

    steps:
      - uses: actions/checkout@v7
        with:
          path: streamrune-ecommerce-demo

      - uses: actions/checkout@v7
        with:
          repository: StreamRune/streamrune
          path: streamrune

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v6

      # The app suites use Testcontainers (PostgreSQL, RabbitMQ), as the Spring one does.
      - name: Verify Docker available
        run: docker info

      - name: Run ${{ matrix.tasks }}
        working-directory: streamrune-ecommerce-demo
        run: ./gradlew ${{ matrix.tasks }} --console=plain --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}-test-reports
          path: |
            streamrune-ecommerce-demo/*/build/reports/tests/
            streamrune-ecommerce-demo/*/build/test-results/

  run-paths:
    name: README run paths (Docker Compose, bootRun)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          path: streamrune-ecommerce-demo

      - uses: actions/checkout@v7
        with:
          repository: StreamRune/streamrune
          path: streamrune

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v6

      # The README's Quick Start, command for command: build the two JARs the images copy, then
      # start all five services. --wait returns once every service runs (and is healthy where it
      # has a health check) and fails when one exits, e.g. a backend that could not reach the
      # database or an image whose JAR was missing from the build context.
      - name: Quick Start - build the JARs
        working-directory: streamrune-ecommerce-demo
        run: ./gradlew :spring-app:bootJar :notifications-service:bootJar --console=plain --no-daemon

      - name: Quick Start - docker compose up
        working-directory: streamrune-ecommerce-demo
        run: docker compose up -d --wait

      - name: Quick Start - backend, notifications service and frontend answer
        working-directory: streamrune-ecommerce-demo
        run: bash scripts/wait-for-http.sh http://localhost:8080/actuator/health '"status":"UP"' http://localhost:8090/health '' http://localhost:3000 ''

      # The frontend against the backend, with the stack of the Quick Start up: the Playwright
      # suite drives the frontend container at :3000. Its backend-dependent specs run here and
      # nowhere else in CI. writes.live.spec.ts performs every write action of the pages against
      # the backend container (register a customer, place and cancel an order, ship and deliver,
      # create a product and change its price and stock, the payment-failure switch, edit, export
      # and forget) and asserts each result through the page. replay-safety.live.spec.ts writes an
      # unkeyed dead-letter entry into the stack's database (docker compose exec postgres) and
      # drives the Admin page's Retry through the backend's 409 to the confirmed forced replay, and
      # sends a stock adjustment twice under one Idempotency-Key. E2E_REQUIRE_BACKEND makes a backend
      # that does not answer a failure instead of a skip; E2E_REUSE_SERVER has Playwright use the
      # frontend that is already up instead of starting its own.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: streamrune-ecommerce-demo/frontend/package-lock.json

      - name: Quick Start - install the Playwright suite
        working-directory: streamrune-ecommerce-demo/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Quick Start - Playwright suite against the running stack
        working-directory: streamrune-ecommerce-demo/frontend
        env:
          E2E_REQUIRE_BACKEND: '1'
          E2E_REUSE_SERVER: '1'
        # line for the job log, html for the artifact: with the traces the config keeps for
        # failed tests, the upload below shows what the page looked like when a test failed.
        run: npx playwright test --reporter=line,html

      - name: Quick Start - upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-running-stack
          path: |
            streamrune-ecommerce-demo/frontend/playwright-report/
            streamrune-ecommerce-demo/frontend/test-results/

      - name: Quick Start - logs on failure
        if: failure()
        working-directory: streamrune-ecommerce-demo
        run: docker compose logs --no-color

      - name: Quick Start - docker compose down
        if: always()
        working-directory: streamrune-ecommerce-demo
        run: docker compose down -v

      # "Running Individually": only the database and the broker in Docker, the application from
      # Gradle, on an empty database it has to create the schema in.
      - name: Running Individually - start PostgreSQL and RabbitMQ
        working-directory: streamrune-ecommerce-demo
        run: docker compose up -d --wait postgres rabbitmq

      - name: Running Individually - bootRun answers
        working-directory: streamrune-ecommerce-demo
        run: |
          ./gradlew :spring-app:bootRun --console=plain --no-daemon > bootrun.log 2>&1 &
          bash scripts/wait-for-http.sh http://localhost:8080/actuator/health '"status":"UP"'

      - name: Running Individually - application log on failure
        if: failure()
        working-directory: streamrune-ecommerce-demo
        run: cat bootrun.log || true

      - name: Running Individually - docker compose down
        if: always()
        working-directory: streamrune-ecommerce-demo
        run: docker compose down -v

  frontend-e2e:
    name: Frontend Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Backend-dependent specs in tests/e2e/ self-skip via
        # isBackendReachable() when the backend is not running.
        # This job exercises the no-backend path: the page-render contract
        # and, in write-contracts.spec.ts, the request each write action
        # sends. The run-paths job runs the suite against the started stack.
        # line for the job log, html and the failed tests' traces for the upload below.
        run: npx playwright test --reporter=line,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
