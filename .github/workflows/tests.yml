name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-integration:
    name: Spring backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: streamrune-ecommerce-demo

      - uses: actions/checkout@v4
        with:
          repository: StreamRune/streamrune
          path: streamrune
          # Falls back to the default token once the repository is public.
          token: ${{ secrets.STREAMRUNE_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v4

      # The integration tests use Testcontainers, which expects a Docker
      # daemon. ubuntu-latest runners ship Docker out of the box; expose it
      # via the default socket.
      - name: Verify Docker available
        run: docker info

      - name: Run :spring-app:test
        working-directory: streamrune-ecommerce-demo
        run: ./gradlew :spring-app:test --console=plain --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-app-test-reports
          path: |
            streamrune-ecommerce-demo/spring-app/build/reports/tests/
            streamrune-ecommerce-demo/spring-app/build/test-results/

  frontend-e2e:
    name: Frontend Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Backend-dependent specs in tests/e2e/ self-skip via
        # isBackendReachable() when the Spring backend is not running.
        # CI exercises the no-backend path — the page-render contract.
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
